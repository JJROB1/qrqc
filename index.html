<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QRQC - Tirage au sort</title>
<style>
:root{--bg:#12082b;--panel:#1c0f3d;--cell:#2a1a55;--gold:#FFD93D;--pink:#FF3B6B;--teal:#2EC4B6;--soft:#a99bd1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:"Segoe UI",system-ui,sans-serif}
h1{margin:0;padding:10px;text-align:center;font:bold 40px Rye,"Arial Black",Impact,sans-serif;color:var(--gold);text-shadow:4px 4px 0 var(--pink);border-top:10px solid var(--pink)}
main{display:flex;gap:12px;padding:0 12px 12px;flex-wrap:wrap}
#game{flex:1 1 560px;min-width:0}
#tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
#tabs button{flex:1;background:var(--cell);color:#fff;border:0;padding:9px 6px;font-weight:bold;cursor:pointer}
#tabs button.on{background:var(--pink)}
canvas{width:auto;height:auto;max-width:100%;max-height:72vh;aspect-ratio:760/670;display:block;margin:auto;background:var(--bg)}
#go{width:100%;margin-top:6px;padding:12px;border:0;background:var(--pink);color:#fff;font:bold 20px Rye,"Arial Black",Impact,sans-serif;cursor:pointer}
#go:disabled{opacity:.5;cursor:default}
aside{flex:0 0 340px;max-width:100%;background:var(--panel);padding:16px;border-radius:6px}
aside h2{margin:0;color:var(--gold);font:bold 20px "Arial Black",Impact,sans-serif}
small{color:var(--soft)}
#list{max-height:300px;overflow:auto;margin:8px 0;background:var(--cell)}
.row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px solid #12082b}
.row.off .nm{color:#6f648f}
.row .nm{flex:1;cursor:text}
.row .x{cursor:pointer;color:var(--pink);font-weight:bold}
.row input{width:18px;height:18px}
.bar{display:flex;gap:6px;margin:6px 0}
.bar button,.bar input{flex:1;padding:8px;border:0;font-size:13px}
.bar button{background:#3d2a75;color:#fff;cursor:pointer}
.bar input{background:var(--cell);color:#fff;font-size:15px;min-width:0}
.bar button.add{background:var(--teal);color:#1a0b2e;font-weight:bold;flex:0 0 auto}
#hist{list-style:none;margin:6px 0 0;padding:0;background:var(--cell);color:var(--gold);max-height:150px;overflow:auto}
#hist li{padding:4px 8px}
</style></head><body>
<h1>QRQC</h1>
<main>
<section id="game">
<div id="tabs"></div>
<canvas id="cv"></canvas>
<button id="go"></button>
</section>
<aside>
<h2>PARTICIPANTS</h2>
<small id="count"></small><br>
<small>Coche un prénom pour qu'il participe. Clique sur un nom pour le modifier.</small>
<div id="list"></div>
<div class="bar"><input id="inp" placeholder="Nouveau nom" maxlength="30"><button class="add" id="add">＋ Ajouter</button></div>
<div class="bar"><button id="ca">Tout cocher</button><button id="cn">Tout décocher</button></div>
<div class="bar"><button id="sh">Mélanger</button><button id="cl">Tout effacer</button></div>
<label><input type="checkbox" id="rm"> Décocher le gagnant après chaque tirage</label>
<h2 style="margin-top:12px;font-size:16px">DERNIERS GAGNANTS</h2>
<ul id="hist"></ul>
</aside>
</main>
<script>
const $=id=>document.getElementById(id),now=()=>performance.now(),R=Math.random,PI=Math.PI,D=PI/180;
const C=["#FF3B6B","#FFD93D","#2EC4B6","#7B2FF7","#FF8C42","#3A86FF","#06D6A0","#F72585"];
const GOLD="#FFD93D",PINK="#FF3B6B",SOFT="#a99bd1",DARK="#1a0b2e",W=760,H=670,FAIR='Rye,"Arial Black",Impact,sans-serif';
const cv=$("cv"),g=cv.getContext("2d");const S=Math.min(3,Math.max(2,Math.ceil(window.devicePixelRatio||1)));cv.width=W*S;cv.height=H*S;g.scale(S,S);

// ---------- noms ----------
let entries;
try{entries=JSON.parse(localStorage.getItem("qrqc"))}catch(e){}
if(!Array.isArray(entries))entries=["Olivier","Pierre-Henri","Nicolas","Donetsi","Léa","Maylis","Jean-Baptiste","Guillaume","Valentin","Jeremy","Eric"].map(n=>[n,true]);
const names=()=>entries.filter(e=>e[1]).map(e=>e[0]);
const save=()=>{try{localStorage.setItem("qrqc",JSON.stringify(entries))}catch(e){}};
let busy=false,msg="",anim=null,cur=0,conf=[];
function renderList(){
  const L=$("list");L.innerHTML="";
  entries.forEach((e,i)=>{
    const r=document.createElement("div");r.className="row"+(e[1]?"":" off");
    r.innerHTML='<input type="checkbox"><span class="nm"></span><span class="x" title="Supprimer">✕</span>';
    r.children[0].checked=e[1];r.children[1].textContent=(i+1)+". "+e[0];
    r.children[0].onchange=ev=>{if(busy)return(ev.target.checked=e[1]);e[1]=ev.target.checked;changed()};
    r.children[1].onclick=()=>{if(busy)return;const v=prompt("Nouveau nom :",e[0]);if(v&&v.trim()){e[0]=v.trim().slice(0,30);changed()}};
    r.children[2].onclick=()=>{if(busy)return;entries.splice(i,1);changed()};
    L.appendChild(r);
  });
  $("count").textContent=names().length+" prénom(s) coché(s) sur "+entries.length;
}
function changed(){save();renderList();games.forEach(x=>x.reset&&x.reset());msg=games[cur].hint}
function add(){if(busy)return;const v=$("inp").value.trim();if(!v)return;if(entries.length>=40)return alert("Maximum 40 noms.");entries.push([v.slice(0,30),true]);$("inp").value="";changed()}
$("add").onclick=add;$("inp").onkeydown=e=>e.key=="Enter"&&add();
$("ca").onclick=()=>{if(!busy){entries.forEach(e=>e[1]=true);changed()}};
$("cn").onclick=()=>{if(!busy){entries.forEach(e=>e[1]=false);changed()}};
$("sh").onclick=()=>{if(!busy){entries.sort(()=>R()-.5);changed()}};
$("cl").onclick=()=>{if(!busy&&entries.length&&confirm("Supprimer tous les noms de la liste ?")){entries=[];changed()}};

// ---------- outils de dessin ----------
const lab=s=>s.length>16?s.slice(0,15)+"…":s;
const col=(i,n)=>{let k=C.length,x=i%k;if(n>1&&n%k==1&&i==n-1)x=(x+2)%k;return C[x]};
const tc=h=>{const v=[1,3,5].map(i=>parseInt(h.substr(i,2),16));return .299*v[0]+.587*v[1]+.114*v[2]>140?DARK:"#fff"};
const stars=Array.from({length:70},()=>[R()*W,R()*H,[1,1,2,2,3][R()*5|0],["#fff",GOLD,SOFT][R()*3|0]]);
const bulbs=[];
function bg(){g.fillStyle="#12082b";g.fillRect(0,0,W,H);stars.forEach(s=>{g.fillStyle=s[3];g.beginPath();g.arc(s[0],s[1],s[2],0,7);g.fill()})}
function circ(x,y,r,fill,stroke,lw){g.beginPath();g.arc(x,y,r,0,7);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||2;g.stroke()}}
function txt(s,x,y,font,color,al,rot){g.save();g.translate(x,y);if(rot)g.rotate(rot);g.font=font;g.fillStyle=color;g.textAlign=al||"center";g.textBaseline="middle";g.fillText(s,0,0);g.restore()}
function ring(cx,cy,r,n,size){const t=(now()/(busy?100:380)|0);for(let i=0;i<n;i++){const a=2*PI*i/n;circ(cx+r*Math.cos(a),cy-r*Math.sin(a),size,(i+t)%2?"#7a5c1a":"#FFF3B0","#3b2a05",1)}}
function sectors(cx,cy,Rr,ang,hub,ns){
  const n=ns.length,e=360/n,fs=Math.max(7,Math.min(20,480/n|0,(Rr-24-hub)/(Math.max(...ns.map(s=>lab(s).length))*.8)|0));
  ns.forEach((s,i)=>{
    const a=ang+i*e,c=col(i,n);g.fillStyle=c;g.beginPath();
    if(n==1)g.arc(cx,cy,Rr,0,7);else{g.moveTo(cx,cy);g.arc(cx,cy,Rr,-(a+e)*D,-a*D)}
    g.closePath();g.fill();g.strokeStyle="#fff";g.lineWidth=2;g.stroke();
    const m=(((a+e/2)%360)+360)%360,f=m>90&&m<270;
    g.save();g.translate(cx,cy);g.rotate(-m*D);if(f)g.rotate(PI);
    g.font=`bold ${fs}px "Segoe UI",sans-serif`;g.fillStyle=tc(c);g.textBaseline="middle";g.textAlign=f?"left":"right";
    g.fillText(lab(s),f?-(Rr-16):Rr-16,0);g.restore();
  });
}
function hilite(cx,cy,Rr,ang,i,n){if(i==null||n<2)return;const e=360/n,a=ang+i*e;g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,Rr,-(a+e)*D,-a*D);g.closePath();g.strokeStyle=GOLD;g.lineWidth=6;g.stroke()}
function empty(cx,cy,r,t){circ(cx,cy,r,"#2a1a55","#fff",3);txt(t,cx,cy,`24px ${FAIR}`,SOFT)}
function ok(){const n=names().length;if(n<2){msg="Il faut au moins 2 noms cochés !";return false}return true}
function begin(m){busy=true;$("go").disabled=true;conf=[];msg=m}
function finish(name){
  busy=false;$("go").disabled=false;msg="★  "+name+"  ★";
  conf=Array.from({length:120},()=>({x:R()*W,y:-R()*350,vx:R()*3-1.5,vy:3+R()*4,s:6+R()*5,c:C[R()*8|0]}));
  const li=document.createElement("li"),d=new Date();
  li.textContent=d.toTimeString().slice(0,5)+"  "+games[cur].title+" — "+name;$("hist").prepend(li);
  if($("rm").checked)setTimeout(()=>{if(busy)return;const e=entries.find(e=>e[1]&&e[0]==name);if(e){e[1]=false;changed()}},2800);
}
const tween=(ms,f)=>{const t0=now();anim=()=>{const t=Math.min(1,(now()-t0)/ms);return f(t)||t>=1}};

// ---------- 1 : LA ROUE ----------
const wheel={title:"La Roue",btn:"LANCER LA ROUE !",hint:"Lance la roue !",ang:R()*360,win:null,
reset(){this.win=null},
draw(){
  const cx=380,cy=335,Rr=245,n=names().length;bg();
  circ(cx,cy,Rr+28,"#C9971C","#7a5a0a",3);circ(cx,cy,Rr+3,"#5a3a05");ring(cx,cy,Rr+15,28,6);
  if(!n)empty(cx,cy,Rr,"Coche des noms\n→");else{sectors(cx,cy,Rr,this.ang,46,names());hilite(cx,cy,Rr,this.ang,this.win,n)}
  circ(cx,cy,46,GOLD,"#7a5a0a",3);circ(cx,cy,34,PINK,"#fff",2);txt(busy?"…":"GO!",cx,cy,`bold 18px ${FAIR}`,"#fff");
  g.beginPath();g.moveTo(cx-24,cy-Rr-40);g.lineTo(cx+24,cy-Rr-40);g.lineTo(cx,cy-Rr+20);g.closePath();g.fillStyle="#FF2E4D";g.fill();g.strokeStyle="#fff";g.lineWidth=3;g.stroke();
  circ(cx,cy-Rr-40,8,GOLD,"#fff",2);
},
start(){
  if(busy||!ok())return;begin("La roue tourne...");this.win=null;
  const a0=this.ang,tot=(5+R()*3)*360;
  tween(5000+R()*1500,t=>{this.ang=a0-tot*(1-Math.pow(1-t,4));if(t>=1){
    const n=names().length,e=360/n;this.ang=((this.ang%360)+360)%360;
    const i=Math.floor((((90-this.ang)%360)+360)%360/e)%n;this.win=i;finish(names()[i])}});
}};

// ---------- 2 : MACHINE À SOUS ----------
const slot={title:"Machine à sous",btn:"TIRER LA POIGNÉE !",hint:"Tire la poignée !",pos:[0,0,0],hit:false,lever:205,XS:[158,350,542],
reset(){this.pos=[0,0,0];this.hit=false},
draw(){
  const BODY="#8a1538",ns=names(),n=ns.length;bg();
  g.fillStyle=BODY;g.fillRect(40,20,620,572);g.strokeStyle=GOLD;g.lineWidth=6;g.strokeRect(40,20,620,572);
  txt("MACHINE À SOUS",350,62,`bold 26px ${FAIR}`,GOLD);
  for(let x=62;x<650;x+=30){circ(x,34,5,"#FFF3B0");circ(x,578,5,"#FFF3B0")}
  this.XS.forEach(x=>{g.fillStyle="#fff4d6";g.fillRect(x-90,195,180,210)});
  if(n){
    const fs=Math.max(9,Math.min(22,160/(Math.max(...ns.map(s=>Math.min(s.length,14)))*.8)|0));
    this.XS.forEach((x,k)=>{const p=this.pos[k],b=Math.floor(p),fr=p-b;
      for(let j=-1;j<3;j++){const y=300+(j-fr)*70;if(y<175||y>425)continue;
        const nm=ns[(((b+j)%n)+n)%n],mid=j==0&&fr<.001&&this.hit;
        txt(nm.length>14?nm.slice(0,13)+"…":nm,x,y,`bold ${fs+(mid?2:0)}px "Segoe UI",sans-serif`,mid?"#d6003f":DARK)}});
  }
  g.fillStyle=BODY;g.fillRect(62,90,576,105);g.fillRect(62,405,576,100);
  g.strokeStyle=GOLD;g.lineWidth=5;g.strokeRect(62,195,576,210);
  g.fillStyle=GOLD;g.fillRect(248,195,12,210);g.fillRect(440,195,12,210);
  g.strokeStyle="#FF2E4D";g.lineWidth=3;g.strokeRect(62,265,576,70);
  g.fillStyle=DARK;g.fillRect(200,520,300,46);g.strokeStyle=GOLD;g.lineWidth=3;g.strokeRect(200,520,300,46);
  txt("★ QRQC ★",350,543,`18px ${FAIR}`,GOLD);
  g.fillStyle="#3a2a5a";g.fillRect(698,190,16,155);circ(706,340,18,"#2a1a55",GOLD,2);
  g.strokeStyle="#c0c0d0";g.lineWidth=9;g.beginPath();g.moveTo(706,340);g.lineTo(706,this.lever);g.stroke();
  circ(706,this.lever,18,"#e63946","#fff",3);
},
start(){
  if(busy||!ok())return;begin("Bonne chance...");this.hit=false;
  const n=names().length,w=R()*n|0,p0=this.pos.map(p=>Math.floor(p)%n),
    dist=[0,1,2].map(k=>((w-p0[k])%n+n)%n+n*Math.max(2,Math.ceil((20+10*k)/n))),durs=[2600,3500,4400];
  tween(360,t=>{this.lever=205+115*(t<.5?t*2:2-t*2)});
  const t0=now()+360;
  const prev=anim;anim=()=>{
    const done=prev();if(!done)return false;
    anim=()=>{const el=now()-t0-360;let all=true;
      for(let k=0;k<3;k++){const t=Math.min(1,Math.max(0,el)/durs[k]);this.pos[k]=p0[k]+dist[k]*(1-Math.pow(1-t,3));if(t<1)all=false}
      if(all){this.pos=p0.map((p,k)=>(p+dist[k])%n);this.hit=true;finish(names()[w])}return all};
    return false};
}};

// ---------- 3 : FLÉCHETTES ----------
const darts={title:"Fléchettes",btn:"LANCER LA FLÉCHETTE !",hint:"La fléchette vise un prénom au hasard !",cross:null,dart:null,hit:null,
reset(){this.cross=this.dart=this.hit=null},
draw(){
  const cx=380,cy=300,Rr=235,n=names().length;bg();
  circ(cx,cy,Rr+34,"#0d0d0d",GOLD,3);ring(cx,cy,Rr+17,30,5);
  if(!n)empty(cx,cy,Rr,"Ajoute des noms\n→");else{
    const hub=Rr*.17;sectors(cx,cy,Rr,90,hub,names());circ(cx,cy,hub,"#06D6A0","#fff",2);circ(cx,cy,hub/2,"#d6003f","#fff",2);hilite(cx,cy,Rr,90,this.hit,n)}
  if(this.cross){const[x,y]=this.cross;g.strokeStyle="#ff2e4d";g.lineWidth=3;circ(x,y,24,null,"#ff2e4d",3);g.lineWidth=2;
    g.beginPath();g.moveTo(x-36,y);g.lineTo(x+36,y);g.moveTo(x,y-36);g.lineTo(x,y+36);g.stroke();circ(x,y,3,"#ff2e4d")}
  if(this.dart){const[x,y,ux,uy,s]=this.dart,px=-uy,py=ux,P=(a,b)=>[x-ux*a*s+px*b*s,y-uy*a*s+py*b*s],L=(p,q,c,w)=>{g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(...p);g.lineTo(...q);g.stroke()};
    L(P(0,0),P(85,0),"#9aa0b5",3);L(P(4,0),P(38,0),"#e8e8f0",7);
    [[PINK,17],[GOLD,-17]].forEach(([c,b])=>{g.beginPath();g.moveTo(...P(58,0));g.lineTo(...P(96,b));g.lineTo(...P(90,0));g.closePath();g.fillStyle=c;g.fill();g.strokeStyle="#fff";g.lineWidth=1;g.stroke()});
    circ(x,y,3,"#555")}
},
start(){
  if(busy||!ok())return;begin("Visée en cours...");this.hit=null;this.dart=null;
  const n=names().length,idx=R()*n|0,e=360/n,th=(90+idx*e+e*(.2+R()*.6))*D,rr=235*(.32+R()*.58),
    tx=380+rr*Math.cos(th),ty=300-rr*Math.sin(th),sx=700,sy=625,d=Math.hypot(tx-sx,ty-sy),ux=(tx-sx)/d,uy=(ty-sy)/d;
  tween(2400,t=>{const a=130*(1-t)**2;this.cross=[tx+a*(Math.sin(11*t+.7)+.5*Math.sin(23*t)),ty+a*(Math.cos(9*t)+.5*Math.sin(19*t+1))];
    if(t>=1){this.cross=null;msg="Lancer !";
      tween(500,t=>{const k=Math.pow(t,1.6);this.dart=[sx+(tx-sx)*k,sy+(ty-sy)*k,ux,uy,1.5-.5*k];
        if(t>=1)tween(620,t=>{const f=t*26,a=.22*Math.exp(-f/7)*Math.sin(f*1.3),c=Math.cos(a),s=Math.sin(a);
          this.dart=[tx,ty,ux*c-uy*s,ux*s+uy*c,1];if(t>=1){this.hit=idx;finish(names()[idx])}})});}});
}};

// ---------- 4 : BOWLING ----------
const bowl={title:"Bowling",btn:"LANCER LA BOULE !",hint:"La boule va renverser une quille !",tilt:[],ball:null,w:null,
reset(){this.tilt=names().map(()=>0);this.ball=null;this.w=null},
lane(y){return 150+105*(y-130)/482},
draw(){
  const CX=380,ns=names(),n=ns.length;bg();
  const poly=(e,c)=>{g.beginPath();g.moveTo(CX-150-e,130);g.lineTo(CX+150+e,130);g.lineTo(CX+255+e,612);g.lineTo(CX-255-e,612);g.closePath();g.fillStyle=c;g.fill()};
  poly(26,"#2b2b3a");poly(0,"#c68642");
  g.strokeStyle="#fff";g.lineWidth=3;[-1,1].forEach(s=>{g.beginPath();g.moveTo(CX+s*150,130);g.lineTo(CX+s*255,612);g.stroke()});
  g.beginPath();g.moveTo(CX-this.lane(604),604);g.lineTo(CX+this.lane(604),604);g.stroke();
  if(!n)return;
  const sp=Math.min(36,300/Math.max(1,n-1)),sc=Math.min(1,sp*.85/22),fs=Math.max(6,Math.min(12,136/(Math.max(...ns.map(s=>Math.min(s.length,14)))*.8)|0,sp*.55|0));
  ns.forEach((s,i)=>{const x=CX+(i-(n-1)/2)*sp,win=this.w===i&&!busy;
    txt(s.length>14?s.slice(0,13)+"…":s,x,146,`bold ${fs}px "Segoe UI",sans-serif`,win?GOLD:"#fff","left",-PI/2);
    g.save();g.translate(x,230);g.rotate((this.tilt[i]||0)*D);g.scale(sc,sc);
    g.fillStyle=win?"#fff2b0":"#f8f8f8";g.strokeStyle="#8a8a9a";g.lineWidth=1;
    g.beginPath();g.ellipse(0,-20,9,22,0,0,7);g.fill();g.stroke();circ(0,-46,7,g.fillStyle,"#8a8a9a",1);
    g.fillStyle="#e63946";g.fillRect(-8,-30,16,5);g.restore()});
  if(this.ball){const[x,y,r,p]=this.ball;circ(x,y,r,"#1d3b8b","#0d1f55",2);circ(x-r*.35,y-r*.4,r*.2,"#6f8fe0");
    for(let k=0;k<3;k++)circ(x+.45*r*Math.cos(p+k*.5),y+.45*r*Math.sin(p+k*.5),Math.max(1.5,r*.1),"#050a22")}
},
start(){
  if(busy||!ok())return;begin("La boule roule...");
  const n=names().length,sp=Math.min(36,300/Math.max(1,n-1)),w=R()*n|0,side=R()<.5?-1:1,
    x0=380+R()*60-30,xt=380+(w-(n-1)/2)*sp,curve=(R()<.5?-1:1)*(40+R()*60);
  this.tilt=names().map(()=>0);this.w=null;
  tween(2500,t=>{const y=572+(221-572)*t;this.ball=[x0+(xt-x0)*t+curve*Math.sin(PI*t),y,12+16*(y-221)/351,t*60*.35];
    if(t>=1){this.ball=null;msg="";
      tween(830,t=>{const f=t*50,k=Math.min(1,f/34);this.tilt[w]=side*96*k*k;
        for(const d of[1,2])for(const s of[-1,1]){const j=w+s*d;if(j>=0&&j<n)this.tilt[j]=s*(9/d)*Math.sin(f*.8)*Math.exp(-f/14)}
        if(t>=1){this.w=w;finish(names()[w])}})}});
}};

// ---------- 5 : GALTON ----------
const galton={title:"Planche de Galton",btn:"LÂCHER LA BILLE !",hint:"La bille rebondit de cheville en cheville !",ball:null,hit:null,
geo(){const n=names().length,dx=Math.min(52,700/n),dy=Math.min(dx*.9,(470-85)/Math.max(1,n-2)),pr=Math.max(2.5,dx*.1),br=Math.max(3,dx*.22);return{n,dx,dy,pr,br}},
reset(){this.ball=this.hit=null},
draw(){
  bg();const{n,dx,dy,pr,br}=this.geo();if(!n)return;const CX=380,Y0=85,BT=495,BB=612,ns=names();
  g.strokeStyle=GOLD;g.lineWidth=3;g.beginPath();g.moveTo(CX-n*dx/2,BT);g.lineTo(CX,Y0-30);g.lineTo(CX+n*dx/2,BT);g.stroke();

  trapOpen(i){return(this.fr+[0,50,100,25,75][i%5])%150<60}
  spSt(i){const l=this.sp[i]-this.st[i];return l<=12?"fire":l<=32?"charge":"idle"}
  turn(b){return b.x<140||b.x>480}
  rb(b,qx,qy,md,e){const dx=b.x-qx,dy=b.y-qy,d2=dx*dx+dy*dy;if(d2<md*md&&d2>1e-12){const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;b.x=qx+nx*md;b.y=qy+ny*md;const v=b.vx*nx+b.vy*ny;if(v<0){b.vx-=e*v*nx;b.vy-=e*v*ny}}}
  step(){
    this.fr++;const B=this.B,r=this.r;B.spin.forEach((s,i)=>this.sa[i]+=s.w);
    B.springs.forEach((sp,i)=>{if(++this.st[i]>=this.sp[i]){this.st[i]=0;this.sp[i]=110+R()*120|0}
      if(this.spSt(i)=="fire")this.m.forEach(b=>{if(b.done||this.fr-b.kick<25)return;
        if(Math.abs(b.x-sp.x)<20&&sp.y-r-12<b.y&&b.y<sp.y-r+3){b.vx=sp.dir*2.2+R()*.6-.3;b.vy=-9+R()*.8-.4;b.kick=this.fr}})});
    const segs=B.segs.slice();
    B.spin.forEach((s,i)=>{const c=Math.cos(this.sa[i]),n=Math.sin(this.sa[i]);segs.push([s.cx-s.L*c,s.cy-s.L*n,s.cx+s.L*c,s.cy+s.L*n])});

        for(const[x1,y1,x2,y2]of segs){if(b.x<Math.min(x1,x2)-e||b.x>Math.max(x1,x2)+e||b.y<Math.min(y1,y2)-e||b.y>Math.max(y1,y2)+e)continue;

      for(let i=0;i<act.length;i++){const a=act[i];for(let j=i+1;j<act.length;j++){const b=act[j],dx=b.x-a.x,dy=b.y-a.y;
        if(Math.abs(dx)>2*r||Math.abs(dy)>2*r||!(!this.go||this.turn(a)||this.turn(b)))continue;
        const d2=dx*dx+dy*dy;if(d2>=4*r*r||d2<1e-9)continue;const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,pu=(2*r-d)/2;
        a.x-=nx*pu;a.y-=ny*pu;b.x+=nx*pu;b.y+=ny*pu;const v=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
        if(v>0){const im=.78*v;a.vx-=im*nx;a.vy-=im*ny;b.vx+=im*nx;b.vy+=im*ny}}}}
    this.m.forEach((b,k)=>{if(!b.done&&b.y>604){b.done=1;this.order.push(k)}});
    if(this.order.length==this.n)this.fin=1;
    else if(this.fr>14000){this.m.map((b,k)=>k).filter(k=>!this.m[k].done).sort((a,b)=>this.m[b].y-this.m[a].y).forEach(k=>{this.m[k].done=1;this.order.push(k)});this.fin=1}}
}
const marble={title:"Course de billes",btn:"OUVRIR LA BARRIÈRE !",hint:"La dernière bille à franchir la ligne d'arrivée est l'élue !",q:null,perm:[],cols:[],gf:0,
newRace(){const n=names().length;this.perm=[...Array(n).keys()].sort(()=>R()-.5);
  this.cols=this.perm.map((_,i)=>`hsl(${(i*.618034%1)*360},${62+28*((i>>1)%2)}%,${i%2?48:62}%)`);this.q=new Race(n);this.gf=0},

  g.lineCap="round";g.strokeStyle="#cfc7ff";g.lineWidth=6;B.rails.forEach(([a,b,c,d])=>{g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()});
  g.strokeStyle="#2EC4B6";g.lineWidth=5;B.posts.forEach(([x,t,b])=>{g.beginPath();g.moveTo(x,t);g.lineTo(x,b);g.stroke();circ(x,b,4,"#8ff5e8")});
  B.holes.forEach(([k,hx])=>{const y=B.yOn(k,hx);g.beginPath();g.moveTo(hx-8,y+12);g.lineTo(hx+8,y+12);g.lineTo(hx,y+24);g.fillStyle="#8ff5e8";g.fill();txt("RACCOURCI",hx,y+36,"bold 7px 'Segoe UI'","#8ff5e8")});
  for(let a=0;a<2;a++)for(let k=0;k<5;k++){g.fillStyle=(a+k)%2?"#fff":"#000";g.fillRect(540+k*10,600+a*8,10,8)}
  txt("ARRIVÉE",500,612,"bold 9px 'Segoe UI'",GOLD);txt("DÉPART",205,112,"bold 9px 'Segoe UI'",GOLD);
  g.strokeStyle="#ff8c42";g.lineWidth=6;B.traps.forEach((t,i)=>{if(!q.trapOpen(i)){g.beginPath();g.moveTo(t[0],t[1]);g.lineTo(t[2],t[3]);g.stroke()}});
  B.springs.forEach((s,i)=>{const st=q.spSt(i),lf=st=="fire"?9:0;g.fillStyle="#555a6e";g.fillRect(s.x-20,s.y+3,40,5);
    g.strokeStyle="#d8dde3";g.lineWidth=2;g.beginPath();for(let k=0;k<6;k++)g.lineTo(s.x+(k%2?7:-7),s.y-lf+(lf+3)*k/5);g.stroke();
    g.fillStyle={idle:"#9aa0b5",charge:GOLD,fire:"#FF8C42"}[st];g.fillRect(s.x-18,s.y-lf-4,36,4);txt("RESSORT",s.x,s.y+20,"bold 7px 'Segoe UI'","#FF8C42")});

    g.strokeStyle=PINK;g.beginPath();g.moveTo(s.cx,s.cy);g.lineTo(s.cx+s.L*c,s.cy+s.L*sn);g.stroke();
    g.strokeStyle="#fff";g.beginPath();g.moveTo(s.cx,s.cy);g.lineTo(s.cx-s.L*c,s.cy-s.L*sn);g.stroke();circ(s.cx,s.cy,5,GOLD,"#7a5a0a",1)});
  if(!q.go){const[x1,y1,x2,y2]=B.gate,f=this.gf?1-this.gf/10:1;g.strokeStyle=GOLD;g.lineWidth=5;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y1+(y2-y1)*f);g.stroke()}
